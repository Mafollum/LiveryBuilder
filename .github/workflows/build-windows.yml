name: Build Windows

# manual only (Actions tab → Build Windows → Run workflow): this account's runs can't start right now,
# and the program is started with "Start LiveryBuilder.bat" instead
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run dist:win

      - name: Smoke test (start the built program once)
        shell: pwsh
        run: |
          Expand-Archive dist/LiveryBuilder-win-x64.zip -DestinationPath "$env:RUNNER_TEMP\app"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\app\LiveryBuilder.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'The program did not start within 60 seconds' }
          if ($p.ExitCode -ne 0) { throw "The program exited with code $($p.ExitCode)" }
          Write-Host 'LiveryBuilder.exe started and exited cleanly'

      - uses: actions/upload-artifact@v4
        with:
          name: LiveryBuilder-win-x64
          path: dist/LiveryBuilder-win-x64.zip
          if-no-files-found: error
